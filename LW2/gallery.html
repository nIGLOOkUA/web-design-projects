<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gallery</title>
        <style>
            h1 {
                text-align: center;
                font-size: 20px;
            }
            #link-main {
                font-style: italic;
            }
            h2, h3 {
                text-align: center;
            }
            #image-1 {
                font-size: 70%;
            }
            #image-2 {
                font-size: 130%;
            }
            #image-3 {
                font-size: 169%;
            }
            img {
                display: block;
                margin: 0 auto;
            }
        </style>
    </head>
    <body>
        <h1>Галерея Білецького Святослава Андрійовича</h1>
        <a href="index.html" id="link-main">Назад на головну</a>
        <h2>Мої зображення</h2>
        <h3 id="image-1">Зображення у цій папці</h3>
        <img src="640x480.png" alt="Зображення у цій папці" width="640" height="480">
        <h3 id="image-2">Зображення у папці images</h3>
        <img src="images/640x480.png" alt="Зображення у папці images" width="640" height="480">
        <h3 id="image-3">Зображення онлайн</h3>
        <img src="https://placehold.co/1280x1024.png" alt="Зображення онлайн" width="1280" height="1024">
    </body>
</html>
